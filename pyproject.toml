[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polybit"
version = "0.1.0"
description = "Discord bot framework with a double-entry PostgreSQL ledger."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pgserver>=0.1.4",
]

[project.scripts]
polybit = "polybit.__main__:main"

[tool.setuptools.packages.find]
include = ["polybit*"]

[tool.setuptools.package-data]
polybit = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
