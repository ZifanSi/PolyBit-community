<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="RTX 3070 mines PB, PB rents an NVIDIA H200">
  <rect width="900" height="220" rx="12" fill="#0d1117"/>

  <text x="450" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#8b949e">POLYBIT COMPUTE ECONOMY</text>

  <!-- links between the three steps, dashes flow left to right -->
  <g fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
    <line x1="210" y1="84" x2="385" y2="84">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="515" y1="84" x2="690" y2="84">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#8b949e">
    <polygon points="395,84 385,79 385,89"/>
    <polygon points="700,84 690,79 690,89"/>
  </g>
  <g fill="#0d1117" stroke="#8b949e" stroke-width="2.5">
    <rect x="285" y="78" width="20" height="12" rx="6"/>
    <rect x="299" y="78" width="20" height="12" rx="6"/>
    <rect x="590" y="78" width="20" height="12" rx="6"/>
    <rect x="604" y="78" width="20" height="12" rx="6"/>
  </g>

  <!-- RTX 3070: chip -->
  <g stroke="#76b900" stroke-width="2.5" stroke-linecap="round" fill="none">
    <rect x="134" y="68" width="32" height="32" rx="5"/>
    <path d="M142 60v8M150 60v8M158 60v8M142 100v8M150 100v8M158 100v8M126 76h8M126 84h8M126 92h8M166 76h8M166 84h8M166 92h8"/>
  </g>
  <rect x="143" y="77" width="14" height="14" rx="2" fill="#76b900"/>

  <!-- PB: a block -->
  <g stroke="#0d1117" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="450,62 469,73 450,84 431,73" fill="#9BE22D"/>
    <polygon points="431,73 450,84 450,106 431,95" fill="#76B900"/>
    <polygon points="450,84 469,73 469,95 450,106" fill="#4E7A00"/>
  </g>

  <!-- H200: server -->
  <g stroke="#5865f2" stroke-width="2.5" fill="none">
    <rect x="731" y="65" width="38" height="16" rx="3"/>
    <rect x="731" y="87" width="38" height="16" rx="3"/>
  </g>
  <g fill="#5865f2">
    <circle cx="739" cy="73" r="2.2"/>
    <circle cx="739" cy="95" r="2.2"/>
  </g>
  <g stroke="#5865f2" stroke-width="2" stroke-dasharray="2 3">
    <line x1="747" y1="73" x2="762" y2="73"/>
    <line x1="747" y1="95" x2="762" y2="95"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="150" y="146" font-size="26" font-weight="700" fill="#e6edf3">RTX 3070</text>
    <text x="450" y="146" font-size="26" font-weight="700" fill="#e6edf3">PB</text>
    <text x="750" y="146" font-size="26" font-weight="700" fill="#e6edf3">NVIDIA H200</text>
    <text x="150" y="176" font-size="18" fill="#8b949e">your idle gpu mines</text>
    <text x="450" y="176" font-size="18" fill="#8b949e">lands in your wallet</text>
    <text x="750" y="176" font-size="18" fill="#8b949e">spend it on the big one</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="150" y="202" fill="#76b900">worker #12 · mining</text>
    <text x="450" y="202" fill="#76b900">tx 9f3a…c1 · balanced</text>
    <text x="750" y="202" fill="#5865f2">job #7 · 2h · running</text>
  </g>
</svg>
