  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="150" y="166" font-size="26" font-weight="700" fill="#e6edf3">RTX 3070 ×3</text>
    <text x="450" y="166" font-size="26" font-weight="700" fill="#e6edf3">PB</text>
    <text x="750" y="166" font-size="26" font-weight="700" fill="#e6edf3">NVIDIA H200</text>
    <text x="150" y="194" font-size="18" fill="#8b949e">your rig mines</text>
    <text x="450" y="194" font-size="18" fill="#8b949e">lands in your wallet</text>
    <text x="750" y="194" font-size="18" fill="#8b949e">spend it on the big one</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="150" y="220" fill="#76b900">3 workers · mining</text>
    <text x="450" y="220" fill="#76b900">tx 9f3a…c1 · balanced</text>
    <text x="750" y="220" fill="#5865f2">job #7 · 2h · running</text>
