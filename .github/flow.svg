<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Three RTX 3070s mine PB, PB rents an NVIDIA H200">
  <rect width="900" height="240" rx="12" fill="#0d1117"/>
  <defs><g id="blades" fill="#8b949e"><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(0.0)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(51.4)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(102.9)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(154.3)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(205.7)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(257.1)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(308.6)"/></g></defs>

  <text x="450" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#8b949e">POLYBIT COMPUTE ECONOMY</text>

  <!-- links between the three steps, dashes flow left to right -->
  <g fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
    <line x1="298" y1="84" x2="385" y2="84">
