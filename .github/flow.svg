    <circle cx="187" cy="67" r="2.2" fill="#76b900"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="151" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">GPU1</text>
  </g>
  <g>
    <rect x="195" y="56" width="5" height="54" rx="1" fill="#8b949e"/>
    <rect x="200" y="60" width="82" height="46" rx="5" fill="#24272c" stroke="#45494f" stroke-width="1.2"/>
    <rect x="206" y="60" width="70" height="3" fill="#76b900"/>
    <rect x="228" y="106" width="40" height="5" fill="#c8952c"/>
    <circle cx="222" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(222 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.66s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="222" cy="85" r="4" fill="#76b900"/><circle cx="260" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(260 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.71s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="260" cy="85" r="4" fill="#76b900"/>
