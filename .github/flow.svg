    <rect x="110" y="60" width="82" height="46" rx="5" fill="#24272c" stroke="#45494f" stroke-width="1.2"/>
    <rect x="116" y="60" width="70" height="3" fill="#76b900"/>
    <rect x="138" y="106" width="40" height="5" fill="#c8952c"/>
