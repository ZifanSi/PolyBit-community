<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Three RTX 3070s mine PB, PB rents an NVIDIA H200">
  <rect width="900" height="240" rx="12" fill="#0d1117"/>
  <defs><g id="blades" fill="#8b949e"><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(0.0)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(51.4)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(102.9)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(154.3)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(205.7)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(257.1)"/><path d="M0 0C3-5 9-8 12-4C9-2 5 0 0 0Z" transform="rotate(308.6)"/></g></defs>

  <text x="450" y="36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#8b949e">POLYBIT COMPUTE ECONOMY</text>

  <!-- links between the three steps, dashes flow left to right -->
  <g fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
    <line x1="298" y1="84" x2="385" y2="84">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="515" y1="84" x2="690" y2="84">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <g fill="#8b949e">
    <polygon points="395,84 385,79 385,89"/>
    <polygon points="700,84 690,79 690,89"/>
  </g>
  <g fill="#0d1117" stroke="#8b949e" stroke-width="2.5">
    <rect x="321" y="78" width="20" height="12" rx="6"/>
    <rect x="335" y="78" width="20" height="12" rx="6"/>
    <rect x="590" y="78" width="20" height="12" rx="6"/>
    <rect x="604" y="78" width="20" height="12" rx="6"/>
  </g>

  <!-- mining rig: three RTX 3070s, fans spinning -->
  <g>
    <rect x="15" y="56" width="5" height="54" rx="1" fill="#8b949e"/>
    <rect x="20" y="60" width="82" height="46" rx="5" fill="#24272c" stroke="#45494f" stroke-width="1.2"/>
    <rect x="26" y="60" width="70" height="3" fill="#76b900"/>
    <rect x="48" y="106" width="40" height="5" fill="#c8952c"/>
    <circle cx="42" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(42 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.62s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="42" cy="85" r="4" fill="#76b900"/><circle cx="80" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(80 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.67s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="80" cy="85" r="4" fill="#76b900"/>
    <circle cx="97" cy="67" r="2.2" fill="#76b900"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></circle>
    <text x="61" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">GPU0</text>
  </g>
  <g>
    <rect x="105" y="56" width="5" height="54" rx="1" fill="#8b949e"/>
    <rect x="110" y="60" width="82" height="46" rx="5" fill="#24272c" stroke="#45494f" stroke-width="1.2"/>
    <rect x="116" y="60" width="70" height="3" fill="#76b900"/>
    <rect x="138" y="106" width="40" height="5" fill="#c8952c"/>
    <circle cx="132" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(132 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.70s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="132" cy="85" r="4" fill="#76b900"/><circle cx="170" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(170 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="170" cy="85" r="4" fill="#76b900"/>
    <circle cx="187" cy="67" r="2.2" fill="#76b900"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="151" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">GPU1</text>
  </g>
  <g>
    <rect x="195" y="56" width="5" height="54" rx="1" fill="#8b949e"/>
    <rect x="200" y="60" width="82" height="46" rx="5" fill="#24272c" stroke="#45494f" stroke-width="1.2"/>
    <rect x="206" y="60" width="70" height="3" fill="#76b900"/>
    <rect x="228" y="106" width="40" height="5" fill="#c8952c"/>
    <circle cx="222" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(222 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.66s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="222" cy="85" r="4" fill="#76b900"/><circle cx="260" cy="85" r="16" fill="#15171a" stroke="#45494f" stroke-width="1.2"/><g transform="translate(260 85)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.71s" repeatCount="indefinite"/><use href="#blades"/></g></g><circle cx="260" cy="85" r="4" fill="#76b900"/>
    <circle cx="277" cy="67" r="2.2" fill="#76b900"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="241" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">GPU2</text>
  </g>

  <!-- PB: a block -->
  <g stroke="#0d1117" stroke-width="1.5" stroke-linejoin="round">
    <polygon points="450,62 469,73 450,84 431,73" fill="#9BE22D"/>
    <polygon points="431,73 450,84 450,106 431,95" fill="#76B900"/>
    <polygon points="450,84 469,73 469,95 450,106" fill="#4E7A00"/>
  </g>

  <!-- H200: server -->
  <g stroke="#5865f2" stroke-width="2.5" fill="none">
    <rect x="731" y="65" width="38" height="16" rx="3"/>
    <rect x="731" y="87" width="38" height="16" rx="3"/>
  </g>
  <g fill="#5865f2">
    <circle cx="739" cy="73" r="2.2"/>
    <circle cx="739" cy="95" r="2.2"/>
  </g>
  <g stroke="#5865f2" stroke-width="2" stroke-dasharray="2 3">
    <line x1="747" y1="73" x2="762" y2="73"/>
    <line x1="747" y1="95" x2="762" y2="95"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="150" y="166" font-size="26" font-weight="700" fill="#e6edf3">RTX 3070 ×3</text>
    <text x="450" y="166" font-size="26" font-weight="700" fill="#e6edf3">PB</text>
    <text x="750" y="166" font-size="26" font-weight="700" fill="#e6edf3">NVIDIA H200</text>
    <text x="150" y="194" font-size="18" fill="#8b949e">your rig mines</text>
    <text x="450" y="194" font-size="18" fill="#8b949e">lands in your wallet</text>
    <text x="750" y="194" font-size="18" fill="#8b949e">spend it on the big one</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="150" y="220" fill="#76b900">3 workers · mining</text>
    <text x="450" y="220" fill="#76b900">tx 9f3a…c1 · balanced</text>
    <text x="750" y="220" fill="#5865f2">job #7 · 2h · running</text>
  </g>
</svg>
