name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Pinned: a new release can add rules and fail an unchanged tree.
      - run: pip install -e . "ruff==0.17.6" "mypy==2.4.1"

      - name: ruff (lint + bandit security rules)
        run: ruff check polybit tests scripts

      - name: mypy
        run: mypy

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway container, only reachable inside this job
          POSTGRES_DB: polybit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install -e . "pytest>=8" "pytest-asyncio>=0.23" "pytest-cov>=6"

      - name: pytest (fails under the coverage floor in pyproject.toml)
        run: pytest -q --cov --cov-report=term-missing
        env:
          PB_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/polybit_test
